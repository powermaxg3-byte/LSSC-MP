<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NS Track Map" />
  <title>NS Norfolk Terminal — LP Line Track & Milepost PWA</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #facc15;
      --danger: #ef4444;
      --success: #22c55e;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }

    /* Top Header */
    #app-header {
      position: fixed; top: 0; left: 0; right: 0;
      height: calc(56px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding-left: 12px; padding-right: 12px;
      z-index: 1000;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; letter-spacing: 0.3px; }
    .brand-badge { background: var(--accent); color: #000; padding: 3px 7px; border-radius: 5px; font-size: 12px; font-weight: 900; }
    .header-actions { display: flex; gap: 6px; }
    .btn {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 7px; font-size: 12px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

    /* Search & Filter Bar */
    #search-bar {
      position: fixed; top: calc(64px + env(safe-area-inset-top)); left: 10px; right: 10px;
      z-index: 1000; display: flex; gap: 6px; pointer-events: none;
    }
    #search-input {
      pointer-events: auto; flex: 1;
      background: rgba(15, 23, 42, 0.92); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: 14px; outline: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    #search-results {
      position: fixed; top: calc(110px + env(safe-area-inset-top)); left: 10px; right: 10px;
      max-height: 45vh; overflow-y: auto;
      background: rgba(15, 23, 42, 0.98); border: 1px solid var(--border);
      border-radius: 10px; z-index: 1001; display: none;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .result-item {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: var(--panel); }

    /* Map Container */
    #map {
      position: absolute;
      top: calc(56px + env(safe-area-inset-top));
      bottom: 0; left: 0; right: 0;
      z-index: 1;
    }

    /* Milepost Map Label Styling */
    .mp-tooltip {
      background: rgba(0, 0, 0, 0.85) !important;
      color: #facc15 !important;
      border: 1px solid #facc15 !important;
      font-weight: 800; font-size: 11px;
      padding: 1px 5px !important; border-radius: 4px !important;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5) !important;
    }

    /* Bottom Detail Drawer */
    #detail-card {
      position: fixed; left: 10px; right: 10px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      background: rgba(15, 23, 42, 0.97);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 14px; z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      transform: translateY(130%); transition: transform 0.25s ease;
    }
    #detail-card.open { transform: translateY(0); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .mp-pill { background: var(--accent); color: #000; font-weight: 900; font-size: 13px; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 4px; }
    .dot-pill { background: #334155; color: #e2e8f0; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; margin-left: 6px; }
    .coord-box {
      background: #090d16; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-family: monospace; font-size: 13px; color: #38bdf8;
      display: flex; justify-content: space-between; align-items: center; margin: 8px 0;
    }
    .card-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    .card-actions a, .card-actions button {
      text-decoration: none; text-align: center; justify-content: center; padding: 9px 6px; font-size: 12px;
    }

    /* Line Manager Modal */
    #modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px;
    }
    #modal-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto; padding: 16px;
    }
    .modal-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    input.form-in, select.form-in {
      width: 100%; padding: 9px; margin-top: 6px; border-radius: 7px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header id="app-header">
    <div class="brand">
      <span class="brand-badge">NS</span>
      <span>Norfolk Terminal GIS</span>
    </div>
    <div class="header-actions">
      <button class="btn" id="btn-map-type" onclick="cycleBaseMap()">🛰️ Google Hybrid</button>
      <button class="btn" id="btn-calibrate" onclick="toggleEditMode()">🔧 Drag Pins</button>
      <button class="btn" onclick="locateUser()">📍 GPS</button>
      <button class="btn btn-primary" onclick="openModal()">+ Lines</button>
    </div>
  </header>

  <!-- Search Bar -->
  <div id="search-bar">
    <input type="text" id="search-input" placeholder="Search MP (e.g. LP 2.42), Street (Granby), or DOT# (467341K)..." oninput="handleSearch(this.value)" />
  </div>
  <div id="search-results"></div>

  <!-- Main Map -->
  <div id="map"></div>

  <!-- Slide-Up Point Detail Card -->
  <div id="detail-card">
    <div class="card-top">
      <div>
        <span class="mp-pill" id="d-mp">LP 0.0</span>
        <span class="dot-pill" id="d-dot">DOT: N/A</span>
        <h3 id="d-name" style="font-size: 16px; margin-top: 4px;">Location Name</h3>
        <p id="d-notes" style="font-size: 12px; color: var(--muted); margin-top: 2px;"></p>
      </div>
      <button class="btn" onclick="closeDetail()">✕</button>
    </div>
    <div class="coord-box">
      <span id="d-coords">36.878150, -76.323850</span>
      <button class="btn" style="padding: 3px 8px; font-size: 11px;" onclick="copyActiveCoords()">Copy</button>
    </div>
    <div class="card-actions">
      <a id="d-gmaps" class="btn btn-primary" target="_blank" rel="noopener">🌍 Google Maps</a>
      <a id="d-streetview" class="btn" target="_blank" rel="noopener">🛣️ Street View</a>
      <a id="d-amaps" class="btn" target="_blank" rel="noopener">🍎 Apple Maps</a>
    </div>
  </div>

  <!-- Line Manager & Add Point Modal -->
  <div id="modal-overlay">
    <div id="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size:16px;">Rail Line & Milepost Manager</h3>
        <button class="btn" onclick="closeModal()">✕</button>
      </div>

      <div class="modal-section">
        <label style="font-size:12px; color:var(--muted); font-weight:700;">1. SYNC & CALIBRATION</label>
        <p style="font-size:12px; color:var(--muted); margin: 4px 0 8px;">
          If your phone cached older coordinates, tap below to load the verified FRA & Google Maps centerline coordinates.
        </p>
        <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="resetToVerifiedDefaults()">
          🔄 Load Verified Google Maps Coordinates
        </button>
      </div>

      <div class="modal-section">
        <label style="font-size:12px; color:var(--muted); font-weight:700;">2. ADD NEW MILEPOST OR LINE SEGMENT</label>
        <input class="form-in" id="add-line" placeholder="Line Code (e.g., LP Line, N Line, Sewells Pt)" value="LP Line" />
        <input class="form-in" id="add-mp" placeholder="Milepost (e.g., LP 2.80 or N 2.50)" />
        <input class="form-in" id="add-name" placeholder="Street / Control Point / Building Name" />
        <input class="form-in" id="add-dot" placeholder="DOT Crossing or Bridge ID (Optional)" />
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
          <input class="form-in" id="add-lat" placeholder="Latitude (36.xxxx)" type="number" step="any" />
          <input class="form-in" id="add-lng" placeholder="Longitude (-76.xxxx)" type="number" step="any" />
        </div>
        <select class="form-in" id="add-type">
          <option value="milepost">Standard Milepost</option>
          <option value="crossing">Highway-Rail Grade Crossing</option>
          <option value="bridge">Overpass / Underpass Bridge</option>
          <option value="station">Control Point / Timetable Station</option>
          <option value="yard">Yard / Terminal Point</option>
        </select>
        <button class="btn btn-primary" style="width:100%; margin-top:10px; justify-content:center;" onclick="addNewPoint()">+ Save Point to Map</button>
      </div>

      <div class="modal-section">
        <label style="font-size:12px; color:var(--muted); font-weight:700;">3. EXPORT / BACKUP JSON</label>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn" style="flex:1; justify-content:center;" onclick="exportJSON()">⬇️ Export JSON</button>
          <button class="btn" style="flex:1; justify-content:center;" onclick="loadNLineSample()">➕ Load N Line (Br 5 - Portlock)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const STORAGE_KEY = 'ns_norfolk_gis_v2_verified';

    // Verified FRA Crossing Inventory + Google Maps Track Centerline Coordinates
    const VERIFIED_LP_LINE = [
      { id: "lp000", line: "LP Line", mp: "LP 0.00", name: "Lambert's Point Docks / Coal Pier 6", dot: "Pier 6", lat: 36.878150, lng: -76.323850, type: "station", notes: "Western terminus of LP Line; rotary dumpers & pier return leads" },
      { id: "lp050", line: "LP Line", mp: "LP 0.50", name: "Lambert's Point Yard (Mid Throat)", dot: "Yard", lat: 36.876920, lng: -76.315540, type: "yard", notes: "Rule 93 Yard Limits (Max 10 MPH)" },
      { id: "lp100", line: "LP Line", mp: "LP 1.00", name: "Lambert's Point Yard Crossings (East End)", dot: "925204T", lat: 36.875826, lng: -76.309007, type: "milepost", notes: "Official FRA DOT #925204T; CSRM floodwall gate interface" },
      { id: "lp120", line: "LP Line", mp: "LP 1.20", name: "Station Lead Switch", dot: "Switch", lat: 36.874950, lng: -76.305120, type: "station", notes: "Station Lead (LP 1.2 to LP 1.9) controlled by Lamberts Pt Yardmaster" },
      { id: "lp150", line: "LP Line", mp: "LP 1.50", name: "Hampton Blvd Underpass (SR 337)", dot: "467335G", lat: 36.873820, lng: -76.300890, type: "bridge", notes: "Bridge 001.50-1BSB-50' carrying tracks over Hampton Blvd" },
      { id: "lp189", line: "LP Line", mp: "LP 1.89", name: "CP Colley Avenue", dot: "467336N", lat: 36.871910, lng: -76.294680, type: "station", notes: "Timetable Station MP LP 1.9; Bridge 001.89-4CBB-81'; Rule 261 begins Eastbound" },
      { id: "lp210", line: "LP Line", mp: "LP 2.10", name: "Colonial Avenue Crossing", dot: "467337V", lat: 36.870747, lng: -76.291129, type: "crossing", notes: "Verified FRA At-Grade Crossing (36.8707472, -76.291129)" },
      { id: "lp225", line: "LP Line", mp: "LP 2.25", name: "Llewellyn Avenue Crossing", dot: "467339J", lat: 36.869840, lng: -76.288004, type: "crossing", notes: "Verified FRA At-Grade Crossing (36.8698398, -76.288004)" },
      { id: "lp242", line: "LP Line", mp: "LP 2.42", name: "Granby Street Crossing", dot: "467341K", lat: 36.868823, lng: -76.284633, type: "crossing", notes: "Verified FRA At-Grade Crossing (36.8688225, -76.2846327)" },
      { id: "lp261", line: "LP Line", mp: "LP 2.61", name: "Monticello Avenue Overpass", dot: "002.61", lat: 36.868010, lng: -76.281950, type: "bridge", notes: "Highway Overpass Bridge 002.61-4CSB-57'" },
      { id: "lp300", line: "LP Line", mp: "LP 3.00", name: "Milepost LP 3.0", dot: "MP 3.0", lat: 36.867450, lng: -76.279880, type: "milepost", notes: "West of Church Street curve" },
      { id: "lp315", line: "LP Line", mp: "LP 3.15", name: "Church Street Crossing", dot: "467352X", lat: 36.867272, lng: -76.279170, type: "crossing", notes: "Verified FRA At-Grade Crossing (36.8672715, -76.2791695)" },
      { id: "lp330", line: "LP Line", mp: "LP 3.30", name: "Barre Street Crossing", dot: "467356A", lat: 36.865880, lng: -76.276850, type: "station", notes: "Timetable Station Barre Ave; North of Tidewater Dr overpass" },
      { id: "lp343", line: "LP Line", mp: "LP 3.43", name: "Tidewater Drive Overpass", dot: "467357G", lat: 36.864750, lng: -76.275620, type: "bridge", notes: "Highway Overpass Bridge 003.43-4CBB-89'" },
      { id: "lp380", line: "LP Line", mp: "LP 3.80", name: "St. Julian Avenue Crossing", dot: "467358N", lat: 36.859850, lng: -76.272680, type: "crossing", notes: "Equation MP LP 3.8 = SN 2.1; At-Grade Crossing" },
      { id: "lp392", line: "LP Line", mp: "LP 3.92", name: "Goff Street Crossing", dot: "467359V", lat: 36.857640, lng: -76.271720, type: "crossing", notes: "At-Grade Crossing north of Princess Anne Rd" },
      { id: "lp400", line: "LP Line", mp: "LP 4.00", name: "Milepost LP 4.0 (Start Test Mile)", dot: "MP 4.0", lat: 36.856500, lng: -76.271350, type: "milepost", notes: "Speed indicator test mile starts (LP 4.0 to LP 5.0)" },
      { id: "lp405", line: "LP Line", mp: "LP 4.05", name: "Princess Anne Road Crossing", dot: "467360P", lat: 36.855778, lng: -76.271142, type: "crossing", notes: "Verified FRA At-Grade Crossing (36.8557776, -76.2711421)" },
      { id: "lp415", line: "LP Line", mp: "LP 4.15", name: "Virginia Beach Blvd Overpass", dot: "467361W", lat: 36.851850, lng: -76.270420, type: "bridge", notes: "US-58 Highway Overpass Bridge 004.15-4CBB-87'" },
      { id: "lp438", line: "LP Line", mp: "LP 4.38", name: "Olney Road Crossing", dot: "467365Y", lat: 36.849720, lng: -76.269980, type: "crossing", notes: "Verified FRA At-Grade Crossing" },
      { id: "lp452", line: "LP Line", mp: "LP 4.52", name: "Brambleton Avenue Overpass", dot: "467366F", lat: 36.847350, lng: -76.269450, type: "bridge", notes: "Highway Overpass Bridge 004.52-4CBB-82'" },
      { id: "lp481", line: "LP Line", mp: "LP 4.81", name: "I-264 Highway Overpass", dot: "467367M", lat: 36.843950, lng: -76.269050, type: "bridge", notes: "Interstate 264 Overpass Structure 004.81" },
      { id: "lp488", line: "LP Line", mp: "LP 4.88", name: "Lovitt Ave / Park Ave Crossing", dot: "467368U", lat: 36.843120, lng: -76.269180, type: "station", notes: "Timetable Station Lovitt Ave; North approach to Bridge 5" },
      { id: "lp500", line: "LP Line", mp: "LP 5.00", name: "Milepost LP 5.0 (End Test Mile)", dot: "MP 5.0", lat: 36.841250, lng: -76.269450, type: "milepost", notes: "End of LP 4.0-5.0 Speed Test Mile" },
      { id: "lp510", line: "LP Line", mp: "LP 5.10", name: "Bridge 5 (Eastern Branch Elizabeth River)", dot: "Bridge 5", lat: 36.839580, lng: -76.269680, type: "station", notes: "Drawbridge; Milepost Equation MP LP 5.10 = MP N 1.23" }
    ];

    // Load or initialize points
    let railPoints = JSON.parse(localStorage.getItem(STORAGE_KEY)) || VERIFIED_LP_LINE;
    let editMode = false;
    let activePoint = null;

    // Initialize Map centered on LP Corridor
    const map = L.map('map', { zoomControl: false }).setView([36.8673, -76.2792], 14);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Native Google Maps Tile Layers (Exact Match with Google Maps App)
    const baseMaps = [
      {
        name: "🛰️ Google Hybrid",
        layer: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
          maxZoom: 21,
          attribution: '© Google Maps'
        })
      },
      {
        name: "🗺️ Google Streets",
        layer: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
          maxZoom: 21,
          attribution: '© Google Maps'
        })
      },
      {
        name: "🌎 Google Satellite Pure",
        layer: L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
          maxZoom: 21,
          attribution: '© Google Maps'
        })
      }
    ];
    let currentMapIdx = 0;
    baseMaps[0].layer.addTo(map);

    function cycleBaseMap() {
      map.removeLayer(baseMaps[currentMapIdx].layer);
      currentMapIdx = (currentMapIdx + 1) % baseMaps.length;
      baseMaps[currentMapIdx].layer.addTo(map);
      document.getElementById('btn-map-type').innerText = baseMaps[currentMapIdx].name;
    }

    const overlayGroup = L.layerGroup().addTo(map);

    function getMarkerColor(type) {
      if (type === 'station') return '#ef4444';  // Red
      if (type === 'crossing') return '#f59e0b'; // Amber
      if (type === 'bridge') return '#3b82f6';   // Blue
      if (type === 'yard') return '#a855f7';     // Purple
      return '#22c55e';                          // Green for Mileposts
    }

    function renderRailMap() {
      overlayGroup.clearLayers();

      // Group points by line to draw separate polylines
      const lines = {};
      railPoints.forEach(pt => {
        const lineName = pt.line || 'LP Line';
        if (!lines[lineName]) lines[lineName] = [];
        lines[lineName].push(pt);
      });

      Object.keys(lines).forEach((lineName, idx) => {
        const pts = lines[lineName];
        const coords = pts.map(p => [p.lat, p.lng]);

        // Dark outer track casing for high contrast on Google Satellite
        L.polyline(coords, { color: '#000000', weight: 7, opacity: 0.8 }).addTo(overlayGroup);
        // Inner safety-yellow rail line
        L.polyline(coords, {
          color: idx === 0 ? '#facc15' : '#38bdf8',
          weight: 3.5,
          opacity: 1,
          dashArray: '10, 6'
        }).addTo(overlayGroup);
      });

      // Render interactive markers
      railPoints.forEach((pt, index) => {
        const color = getMarkerColor(pt.type);

        // Use draggable standard marker when in Edit/Calibration mode, otherwise high-vis circle
        if (editMode) {
          const dragIcon = L.divIcon({
            className: '',
            html: `<div style="width:20px;height:20px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 0 8px #000;"></div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          });
          const m = L.marker([pt.lat, pt.lng], { icon: dragIcon, draggable: true })
            .bindTooltip(`${pt.mp} (Drag to calibrate)`, { permanent: true, direction: 'top', className: 'mp-tooltip', offset: [0, -10] })
            .addTo(overlayGroup);

          m.on('dragend', (e) => {
            const pos = e.target.getLatLng();
            railPoints[index].lat = Number(pos.lat.toFixed(6));
            railPoints[index].lng = Number(pos.lng.toFixed(6));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(railPoints));
            renderRailMap();
            showDetail(railPoints[index]);
          });
        } else {
          const cm = L.circleMarker([pt.lat, pt.lng], {
            radius: 8,
            fillColor: color,
            color: '#000000',
            weight: 2.5,
            fillOpacity: 1
          })
          .bindTooltip(pt.mp, { permanent: true, direction: 'right', className: 'mp-tooltip', offset: [8, 0] })
          .on('click', () => showDetail(pt))
          .addTo(overlayGroup);
        }
      });
    }

    function showDetail(pt) {
      activePoint = pt;
      document.getElementById('d-mp').innerText = pt.mp;
      document.getElementById('d-dot').innerText = pt.dot ? `ID: ${pt.dot}` : pt.line;
      document.getElementById('d-name').innerText = pt.name;
      document.getElementById('d-notes').innerText = pt.notes || '';
      document.getElementById('d-coords').innerText = `${pt.lat.toFixed(6)}, ${pt.lng.toFixed(6)}`;

      // Direct Google Maps, Street View, and Apple Maps links
      document.getElementById('d-gmaps').href = `https://www.google.com/maps/search/?api=1&query=${pt.lat},${pt.lng}`;
      document.getElementById('d-streetview').href = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${pt.lat},${pt.lng}`;
      document.getElementById('d-amaps').href = `https://maps.apple.com/?ll=${pt.lat},${pt.lng}&q=${encodeURIComponent(pt.mp + ' - ' + pt.name)}`;

      document.getElementById('detail-card').classList.add('open');
      map.panTo([pt.lat, pt.lng]);
    }

    function closeDetail() {
      document.getElementById('detail-card').classList.remove('open');
    }

    function copyActiveCoords() {
      if (!activePoint) return;
      const text = `${activePoint.lat.toFixed(6)}, ${activePoint.lng.toFixed(6)}`;
      navigator.clipboard.writeText(text);
      alert(`Copied: ${text}`);
    }

    function toggleEditMode() {
      editMode = !editMode;
      const btn = document.getElementById('btn-calibrate');
      btn.classList.toggle('active', editMode);
      btn.innerText = editMode ? '✅ Done Dragging' : '🔧 Drag Pins';
      renderRailMap();
    }

    function handleSearch(q) {
      const box = document.getElementById('search-results');
      const term = q.trim().toLowerCase();
      if (!term) { box.style.display = 'none'; return; }

      const matches = railPoints.filter(p =>
        p.mp.toLowerCase().includes(term) ||
        p.name.toLowerCase().includes(term) ||
        (p.dot && p.dot.toLowerCase().includes(term))
      );

      if (!matches.length) {
        box.innerHTML = `<div class="result-item"><span>No matching milepost or DOT ID</span></div>`;
      } else {
        box.innerHTML = matches.map(m => `
          <div class="result-item" onclick="selectSearchResult('${m.id}')">
            <div>
              <strong style="color:var(--accent);">${m.mp}</strong> — ${m.name}
              <div style="font-size:11px; color:var(--muted);">DOT/ID: ${m.dot || 'N/A'} | ${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}</div>
            </div>
            <span style="font-size:12px;">➔</span>
          </div>
        `).join('');
      }
      box.style.display = 'block';
    }

    function selectSearchResult(id) {
      document.getElementById('search-results').style.display = 'none';
      document.getElementById('search-input').value = '';
      const pt = railPoints.find(p => p.id === id);
      if (pt) {
        map.setView([pt.lat, pt.lng], 18);
        showDetail(pt);
      }
    }

    function locateUser() {
      if (!navigator.geolocation) return alert('GPS not supported on this device');
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        L.circleMarker([latitude, longitude], {
          radius: 9, fillColor: '#38bdf8', color: '#fff', weight: 3, fillOpacity: 1
        }).addTo(map).bindPopup('Your GPS Location').openPopup();
        map.setView([latitude, longitude], 16);
      }, err => alert('Location error: ' + err.message), { enableHighAccuracy: true });
    }

    function openModal() { document.getElementById('modal-overlay').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

    function resetToVerifiedDefaults() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(VERIFIED_LP_LINE));
      railPoints = JSON.parse(JSON.stringify(VERIFIED_LP_LINE));
      renderRailMap();
      closeModal();
      map.fitBounds(L.latLngBounds(railPoints.map(p => [p.lat, p.lng])));
    }

    function addNewPoint() {
      const line = document.getElementById('add-line').value.trim() || 'LP Line';
      const mp = document.getElementById('add-mp').value.trim();
      const name = document.getElementById('add-name').value.trim();
      const dot = document.getElementById('add-dot').value.trim();
      const lat = parseFloat(document.getElementById('add-lat').value);
      const lng = parseFloat(document.getElementById('add-lng').value);
      const type = document.getElementById('add-type').value;

      if (!mp || !name || isNaN(lat) || isNaN(lng)) {
        return alert('Please enter Milepost, Name, and valid Latitude/Longitude.');
      }

      const newPt = { id: 'pt_' + Date.now(), line, mp, name, dot, lat, lng, type, notes: `Custom added to ${line}` };
      railPoints.push(newPt);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(railPoints));
      renderRailMap();
      closeModal();
      map.setView([lat, lng], 17);
      showDetail(newPt);
    }

    function loadNLineSample() {
      const nLinePoints = [
        { id: "n123", line: "N Line", mp: "N 1.23", name: "Bridge 5 South Abutment (LP 5.10 = N 1.23)", dot: "Bridge 5", lat: 36.839580, lng: -76.269680, type: "station", notes: "Norfolk District N Line begins" },
        { id: "n220", line: "N Line", mp: "N 2.20", name: "Carolina Junction / South Norfolk", dot: "CP Carolina", lat: 36.824520, lng: -76.268110, type: "station", notes: "Junction with Chesapeake & Albemarle / NS lines" },
        { id: "n350", line: "N Line", mp: "N 3.50", name: "Portlock Yard (West End / Poindexter St)", dot: "Portlock", lat: 36.809150, lng: -76.261890, type: "yard", notes: "Portlock Yard throat" },
        { id: "n470", line: "N Line", mp: "N 4.70", name: "Portlock Road / Bainbridge Blvd", dot: "Portlock East", lat: 36.794800, lng: -76.252400, type: "station", notes: "East End Portlock Yard" }
      ];
      nLinePoints.forEach(np => {
        if (!railPoints.some(r => r.id === np.id)) railPoints.push(np);
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(railPoints));
      renderRailMap();
      closeModal();
      map.fitBounds(L.latLngBounds(railPoints.map(p => [p.lat, p.lng])));
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(railPoints, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ns_norfolk_terminal_mileposts.json';
      a.click();
    }

    // Initial Render
    renderRailMap();
  </script>
</body>
</html>
